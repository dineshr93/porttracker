<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>porttracker</title>
  <style>
    :root {
      --bg: #0b0d10;
      --bg-grad-1: #0f1116;
      --bg-grad-2: #07080c;
      --card: #14171c;
      --card-border: #23272f;
      --text: #e8eaf0;
      --muted: #8a8f98;
      --accent: #22d3ee;          /* cyan */
      --accent-strong: #0ea5e9;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --green: #34d399;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, var(--bg-grad-1), transparent 70%),
        linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2));
      background-attachment: fixed;
      min-height: 100vh;
      padding: 2.5rem 1rem;
    }
    .wrap { max-width: 820px; margin: 0 auto; }

    /* Header */
    header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .logo-row { display: flex; align-items: center; gap: 0.75rem; }
    .logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      display: grid; place-items: center;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
      flex-shrink: 0;
    }
    .logo svg { width: 18px; height: 18px; fill: #06283a; }
    h1 {
      font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p.tag { color: var(--muted); font-size: 0.92rem; margin-top: 0.35rem; }

    .add-btn {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      border-radius: 11px;
      border: 1px solid var(--card-border);
      background: #1a1e24;
      color: var(--accent);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.12s;
    }
    .add-btn:hover {
      background: #20242c;
      border-color: var(--accent);
      color: var(--accent-strong);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.25);
    }
    .add-btn:active { transform: scale(0.96); }
    .add-btn svg {
      width: 20px; height: 20px;
      display: block;
      flex-shrink: 0;
    }
    .card[hidden] { display: none; }

    .search-card { padding: 0.45rem 0.9rem; margin-bottom: 1rem; }
    .search-bar { display: flex; align-items: center; gap: 0.6rem; color: var(--muted); }
    .search-bar svg { width: 18px; height: 18px; flex-shrink: 0; }
    .search-bar input {
      flex: 1;
      padding: 0.55rem 0.4rem;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    .search-bar input:focus { outline: none; }
    .search-bar input::placeholder { color: #565b63; }

    /* Cards */
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012)),
                  var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.4rem;
      margin-bottom: 1.4rem;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 1.02rem; font-weight: 600; margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .card h2::before {
      content: ""; width: 3px; height: 1.1em; border-radius: 2px;
      background: linear-gradient(var(--accent), var(--accent-strong));
    }

    /* Form */
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.4rem; }
    .full { grid-column: 1 / -1; }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--card-border);
      border-radius: 9px;
      font: inherit;
      color: var(--text);
      background: #0d0f13;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea { resize: vertical; min-height: 3.2rem; }
    select option { background: #0d0f13; }
    ::placeholder { color: #565b63; }

    .actions { display: flex; gap: 0.6rem; margin-top: 0.35rem; }
    button {
      font: inherit; font-weight: 600;
      padding: 0.55rem 1rem;
      border: 1px solid var(--card-border);
      border-radius: 9px;
      background: #1a1e24;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    button:hover { background: #20242c; border-color: #2e333d; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      border-color: transparent; color: #06283a;
      box-shadow: 0 4px 16px rgba(34, 211, 238, 0.25);
    }
    button.primary:hover { filter: brightness(1.08); box-shadow: 0 6px 20px rgba(34, 211, 238, 0.35); }
    button.danger { color: var(--danger); border-color: transparent; background: var(--danger-soft); }
    button.danger:hover { background: rgba(248, 113, 113, 0.22); }
    button.ghost { background: transparent; color: var(--muted); }
    button.ghost:hover { color: var(--text); background: #20242c; }

    /* Table */
    .table-card { padding: 0.5rem 1.4rem 1.2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th {
      text-align: left; padding: 0.75rem 0.6rem; font-weight: 600;
      color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
      border-bottom: 1px solid var(--card-border);
    }
    td { padding: 0.7rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.12s; }
    tbody tr:hover { background: rgba(255,255,255,0.025); }
    td.port {
      font-variant-numeric: tabular-nums; font-weight: 700;
    }
    td.port a {
      color: var(--accent); text-decoration: none;
      border-bottom: 1px dashed transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    td.port a:hover {
      color: var(--accent-strong); border-bottom-color: var(--accent);
    }
    td.port a::after { content: " ↗"; font-size: 0.8em; opacity: 0.6; }
    .empty {
      color: var(--muted); font-size: 0.92rem; padding: 1.6rem 0;
      text-align: center; border: 1px dashed var(--card-border); border-radius: 10px;
      margin-top: 0.5rem;
    }
    .row-actions { white-space: nowrap; }
    .row-actions button { padding: 0.28rem 0.55rem; font-size: 0.8rem; }

    /* Feedback */
    .err { color: var(--danger); font-size: 0.9rem; margin-top: 0.75rem; }
    .msg { color: var(--green); font-size: 0.9rem; margin-top: 0.75rem; }

    @media (max-width: 560px) {
      body { padding: 1.5rem 0.75rem; }
      form { grid-template-columns: 1fr; }
      .logo { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="logo-row">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 9l8-6 8 6-8 6-8-6z"/><path d="M4 15l8 6 8-6" fill="none" stroke="#06283a" stroke-width="2"/></svg>
          </div>
          <h1>porttracker</h1>
        </div>
        <p class="tag">Remember which service runs on which local host port.</p>
      </div>
      <div class="header-actions">
        <button id="searchBtn" class="add-btn" title="Search mappings" aria-label="Search mappings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button id="addBtn" class="add-btn" title="Add a port mapping" aria-label="Add a port mapping">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div class="card search-card" id="searchCard" hidden>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="searchInput" type="search" placeholder="Search by port, service, or endpoint…">
      </div>
    </div>

    <div class="card" id="formCard" hidden>
      <h2 id="formTitle">Add a port mapping</h2>
      <form id="form">
        <div>
          <label for="port">Port</label>
          <input id="port" type="number" min="1" max="65535" required placeholder="e.g. 8080">
        </div>
        <div>
          <label for="service">Service</label>
          <input id="service" type="text" required placeholder="e.g. Dev API server">
        </div>
        <div class="full">
          <label for="description">Endpoint (optional)</label>
          <textarea id="description" placeholder="/v1/models — a path appended when you click the port"></textarea>
        </div>
        <div class="full actions">
          <button class="primary" type="submit">Save</button>
          <button class="ghost" type="button" id="resetBtn" hidden>Cancel edit</button>
        </div>
      </form>
      <div id="feedback"></div>
    </div>

    <div class="card table-card">
      <h2>Current mappings</h2>
      <table>
        <thead>
          <tr><th>Port</th><th>Service</th><th>Endpoint</th><th></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>Nothing recorded yet — click the + button to add your first port.</div>
    </div>
  </div>

  <script>
    const api = '/api/ports';
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');
    const form = document.getElementById('form');
    const feedback = document.getElementById('feedback');
    const formTitle = document.getElementById('formTitle');
    const resetBtn = document.getElementById('resetBtn');
    const addBtn = document.getElementById('addBtn');
    const formCard = document.getElementById('formCard');
    const searchBtn = document.getElementById('searchBtn');
    const searchCard = document.getElementById('searchCard');
    const searchInput = document.getElementById('searchInput');

    let editingId = null;
    let allRecords = [];

    async function request(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error || `request failed (${res.status})`);
      return data;
    }

    function show(msg, isErr = false) {
      feedback.innerHTML = '';
      const el = document.createElement('div');
      el.className = isErr ? 'err' : 'msg';
      el.textContent = msg;
      feedback.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    // Build the URL a port click should open: http://0.0.0.0:<port>
    // plus any path stored in the endpoint (e.g. "/v1/models").
    // 0.0.0.0 is what works on this machine; localhost can redirect to an
    // error page in this environment, so stick with 0.0.0.0.
    function portUrl(r) {
      const base = `http://0.0.0.0:${r.port}`;
      const desc = (r.description || '').trim();
      if (desc.startsWith('/')) return base + desc;
      return base;
    }

    async function render() {
      allRecords = await request('GET', api);
      const q = searchInput.value.trim().toLowerCase();
      const records = allRecords.filter((r) =>
        !q ||
        String(r.port).includes(q) ||
        (r.service || '').toLowerCase().includes(q) ||
        (r.description || '').toLowerCase().includes(q)
      );
      tbody.innerHTML = '';
      if (allRecords.length === 0) {
        empty.hidden = false;
        empty.textContent = 'Nothing recorded yet — click the + button to add your first port.';
      } else if (records.length === 0) {
        empty.hidden = false;
        empty.textContent = 'No mappings match your search.';
      } else {
        empty.hidden = true;
      }

      for (const r of records.sort((a, b) => a.port - b.port)) {
        const tr = document.createElement('tr');
        const url = portUrl(r);
        tr.innerHTML = `
          <td class="port"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${r.port}</a></td>
          <td>${escapeHtml(r.service)}</td>
          <td>${escapeHtml(r.description || '')}</td>`;

        const td = document.createElement('td');
        td.className = 'row-actions';
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.onclick = () => startEdit(r);
        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = 'Delete';
        delBtn.onclick = () => confirmDelete(r);
        td.append(editBtn, delBtn);
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;' })[c]);
    }

    function resetForm() {
      form.reset();
      editingId = null;
      formTitle.textContent = 'Add a port mapping';
      resetBtn.hidden = true;
      document.getElementById('port').focus();
    }

    function showAddForm() {
      formCard.hidden = false;
      resetForm();
      updateAddBtn();
    }

    function hideAddForm() {
      formCard.hidden = true;
      updateAddBtn();
    }

    // Icons for the toggle button: '+' when the form is hidden, '×' when it's open.
    const PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    const CLOSE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>';

    function updateAddBtn() {
      const showing = !formCard.hidden;
      addBtn.innerHTML = showing ? CLOSE_SVG : PLUS_SVG;
      addBtn.title = showing ? 'Close form' : 'Add a port mapping';
      addBtn.setAttribute('aria-label', showing ? 'Close form' : 'Add a port mapping');
    }

    function toggleAddForm() {
      if (formCard.hidden) showAddForm();
      else hideAddForm();
    }

    // Search button: magnifier when collapsed, '×' when the search bar is open.
    const SEARCH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>';

    function updateSearchBtn() {
      const showing = !searchCard.hidden;
      searchBtn.innerHTML = showing ? CLOSE_SVG : SEARCH_SVG;
      searchBtn.title = showing ? 'Close search' : 'Search mappings';
      searchBtn.setAttribute('aria-label', showing ? 'Close search' : 'Search mappings');
    }

    function toggleSearch() {
      const showing = searchCard.hidden;
      searchCard.hidden = !showing;
      updateSearchBtn();
      if (showing) {
        searchInput.focus();
      }
    }

    function startEdit(r) {
      formCard.hidden = false;
      editingId = r.id;
      formTitle.textContent = 'Edit mapping';
      document.getElementById('port').value = r.port;
      document.getElementById('service').value = r.service;
      document.getElementById('description').value = r.description || '';
      resetBtn.hidden = false;
      document.getElementById('service').focus();
    }

    async function confirmDelete(r) {
      if (!confirm(`Delete "${r.service}" on port ${r.port}?`)) return;
      await request('DELETE', `${api}/${r.id}`);
      show(`Deleted port ${r.port} (${r.service})`);
      resetForm();
      hideAddForm();
      render();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        port: Number(document.getElementById('port').value),
        service: document.getElementById('service').value.trim(),
        description: document.getElementById('description').value.trim(),
      };
      try {
        if (editingId) {
          await request('PUT', `${api}/${editingId}`, payload);
          show(`Updated port ${payload.port}`);
        } else {
          await request('POST', api, payload);
          show(`Added port ${payload.port} (${payload.service})`);
        }
        resetForm();
        hideAddForm();
        render();
      } catch (err) {
        show(err.message, true);
      }
    });

    resetBtn.addEventListener('click', () => {
      resetForm();
      hideAddForm();
    });

    addBtn.addEventListener('click', toggleAddForm);
    searchBtn.addEventListener('click', toggleSearch);
    searchInput.addEventListener('input', render);

    updateAddBtn();
    updateSearchBtn();

    render().catch((err) => show(err.message, true));
  </script>
</body>
</html>
